[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "free-dose-check"
version = "0.1.0"
description = "A transparent finite-bath equilibrium binding design check."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE.md"]

[project.urls]
Repository = "https://github.com/dataRichinsightPoor/free-dose-check"
Issues = "https://github.com/dataRichinsightPoor/free-dose-check/issues"

[project.optional-dependencies]
test = ["pytest>=8", "mpmath>=1.3"]

[project.scripts]
free-dose-check = "free_dose_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
