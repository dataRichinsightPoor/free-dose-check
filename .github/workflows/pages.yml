name: public-demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install scientific test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify the scientific contract
        run: python -m pytest -q
      - name: Build the shared Python runtime, examples, and source download
        run: python tools/build_web.py
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload the static demo
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the public demo
        id: deployment
        uses: actions/deploy-pages@v5.0.1
